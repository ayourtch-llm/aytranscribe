[workspace]
members = [
    "crates/aytranscribe",
    "crates/vibevoice-asr",
    "crates/vibevoice-core",
    "crates/vibevoice-tokenizer",
    "crates/vibevoice-tts",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
candle-core = { version = "0.8", default-features = false }
candle-nn = { version = "0.8", default-features = false }
candle-transformers = { version = "0.8", default-features = false }
clap = { version = "4.5", features = ["derive"] }
hf-hub = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.4"
symphonia = { version = "0.5", features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
thiserror = "2"
tokenizers = "0.20"
rubato = "0.16"
